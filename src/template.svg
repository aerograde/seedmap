<?xml version="1.0" encoding="UTF-8"?>
<svg id="root" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="100%" height="100%" role="application" aria-label="Offline Minecraft seed map">
  <title>Seedmap — offline Minecraft seed atlas</title>
  <desc>Enter a Minecraft Java 1.21.4 (Winter Drop) seed to explore its biomes and structures, read coordinates, measure a route, and read every enchanting table offer from a seed. Runs entirely offline in this single SVG file.</desc>

  <style><![CDATA[
/*__CSS__*/
  ]]></style>

  <foreignObject x="0" y="0" width="100%" height="100%" style="overflow:hidden">
    <div xmlns="http://www.w3.org/1999/xhtml" class="map-host">
      <canvas id="mapCanvas" aria-label="Generated seed map. Drag to pan, scroll to zoom, and press M to measure."></canvas>
    </div>
  </foreignObject>

  <foreignObject x="0" y="0" width="100%" height="100%" style="overflow:hidden" pointer-events="none">
    <div xmlns="http://www.w3.org/1999/xhtml" class="ui" id="ui">

      <section class="home" id="home">
        <header class="home-top">
          <span class="brand">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1" y="1" width="6" height="6"/>
              <rect x="9" y="1" width="6" height="6" class="half"/>
              <rect x="1" y="9" width="6" height="6" class="half"/>
              <rect x="9" y="9" width="6" height="6"/>
            </svg>
            seedmap
          </span>
          <span class="home-tag">Minecraft Java 1.21.4 · offline</span>
        </header>

        <main class="home-main">
          <p class="home-kicker">Seed atlas</p>
          <h1>Every world starts<br/>with a seed.</h1>
          <p class="home-lede">Browse biomes, structures and strongholds, read the coordinates, measure a route, or line up an enchanting table. One file, no network.</p>
          <form class="seed-form" id="seedForm" autocomplete="off">
            <label for="seedInput">World seed</label>
            <div class="seed-line">
              <input id="seedInput" name="seed" type="text" inputmode="text" maxlength="120"
                     placeholder="a number or a word" spellcheck="false" autocapitalize="off"
                     autocorrect="off" aria-label="Minecraft seed"/>
              <button class="go" type="submit">
                <span>Show map</span>
                <span class="go-arrow" aria-hidden="true">→</span>
              </button>
            </div>
            <p class="seed-help">Try <b>42</b> · letters are hashed like Java Edition · 1.21.4 Winter Drop</p>
          </form>
        </main>

        <footer class="home-bottom">
          <span>Biomes · structures · strongholds · coordinates</span>
          <button class="home-link" id="enchantBtn" type="button">
            Enchantment calculator <span aria-hidden="true">→</span>
          </button>
        </footer>
      </section>

      <div id="calcMount"></div>

      <section class="map-ui" id="mapUi" hidden="hidden">
        <header class="map-bar">
          <button class="bar-back" id="mapHome" type="button" aria-label="Back to seed entry">←</button>
          <div class="bar-seed">
            <span class="bar-label">Seed</span>
            <b id="seedOut">0</b>
            <i class="loadbar" id="loadBar"><i id="loadBarFill"></i></i>
          </div>
          <div class="bar-readout">
            <b class="coords" id="coords">0, 0</b>
            <span class="biome-line" id="biomeLine"><span id="biomeName">—</span><span class="sep" id="bioSep" hidden="hidden">·</span><span class="structure" id="bioStruct" hidden="hidden"></span></span>
          </div>
          <div class="bar-tools">
            <button class="bar-btn" id="measureBtn" type="button" aria-pressed="false">
              Measure <span class="kbd" aria-hidden="true">M</span>
            </button>
            <button class="bar-btn" id="keyToggle" type="button" aria-controls="key" aria-expanded="false">Key</button>
          </div>
        </header>

        <aside class="measure" id="measurePanel" hidden="hidden" aria-live="polite">
          <div class="measure-head">
            <span class="measure-kicker">Route</span>
            <span class="measure-count" id="measureCount">0 points</span>
            <button class="measure-clear" id="measureClear" type="button" hidden="hidden">Clear</button>
          </div>
          <div class="measure-total"><span id="measureTotal">—</span><span class="measure-unit">blocks</span></div>
          <div class="measure-time" id="measureTime">Click the map to place a point</div>
          <div class="measure-route" id="measureRoute"></div>
        </aside>

        <aside class="key" id="key" aria-label="Map key">
          <div class="key-top">
            <span class="key-title">Key</span>
            <span class="key-version">Java 1.21.4</span>
            <button class="key-close" id="keyClose" type="button" aria-label="Close key">×</button>
          </div>
          <div class="key-body">
            <div class="key-section">Structures</div>
            <div class="key-grid" id="keyGrid"></div>
            <div class="key-section">Biome colours</div>
            <div class="biome-grid" id="biomeGrid"></div>
            <p class="key-note">Underground markers are placements, not entrances.</p>
          </div>
        </aside>

        <div class="scale">
          <div class="scale-num" id="scaleNum">500 blocks</div>
          <div class="scale-bar" id="scaleBar" style="width:100px"></div>
        </div>

        <div class="hint" id="hint">Drag to pan · scroll to zoom · M to measure · Esc to leave</div>
      </section>

    </div>
  </foreignObject>

  <script><![CDATA[
/*__APP__*/
  ]]></script>
</svg>
