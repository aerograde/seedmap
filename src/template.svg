<?xml version="1.0" encoding="UTF-8"?>
<svg id="root" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="100%" height="100%" role="application" aria-label="Offline Minecraft seed map">
  <title>Seedmap — offline Minecraft seed atlas</title>
  <desc>Enter a Minecraft Java 1.21.4 (Winter Drop) seed to explore its biomes and structures, tilt the map into a diorama, measure a route, and plan an enchanting table. Runs entirely offline in this single SVG file.</desc>

  <style><![CDATA[
/*__CSS__*/
  ]]></style>

  <foreignObject x="0" y="0" width="100%" height="100%" style="overflow:hidden">
    <div xmlns="http://www.w3.org/1999/xhtml" class="map-host">
      <canvas id="mapCanvas" aria-label="Generated seed map. Drag to pan, scroll to zoom, and press M to measure."></canvas>
    </div>
  </foreignObject>

  <foreignObject x="0" y="0" width="100%" height="100%" style="overflow:hidden" pointer-events="none">
    <div xmlns="http://www.w3.org/1999/xhtml" class="ui" id="ui">

      <section class="home" id="home">
        <div class="home-top">
          <span class="brand">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1" y="1" width="6" height="6"/>
              <rect x="9" y="1" width="6" height="6" class="hot"/>
              <rect x="1" y="9" width="6" height="6"/>
              <rect x="9" y="9" width="6" height="6"/>
            </svg>
            Seedmap
          </span>
          <span class="tag"><i class="tag-dot" aria-hidden="true"></i>Java Edition · 1.21.4 Winter Drop</span>
        </div>

        <div class="home-center">
          <div class="seed-card">
            <canvas class="horizon" id="homeHorizon" width="280" height="40" aria-hidden="true"></canvas>
            <form class="seed-form" id="seedForm" autocomplete="off">
              <div class="seed-card-head">
                <label class="seed-label" for="seedInput">World seed</label>
                <span class="edition">number or word</span>
              </div>
              <div class="seed-line">
                <input id="seedInput" name="seed" type="text" inputmode="text" maxlength="120"
                       placeholder="type a seed" spellcheck="false" autocapitalize="off"
                       autocorrect="off" aria-label="Minecraft seed"/>
              </div>
              <button class="go" type="submit">
                <span>Show the map</span>
                <span class="go-key" aria-hidden="true">↵</span>
              </button>
              <p class="seed-help">Biomes, structures, strongholds<span class="dot">·</span>try <b>42</b><span class="dot">·</span>one file, offline</p>
            </form>
          </div>
        </div>

        <div class="home-bottom">
          <span>Surface generation · every seed is its own world</span>
          <span>Single file · fully offline</span>
        </div>

        <button class="home-feature" id="enchantBtn" type="button" title="Open the enchanting table calculator">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.4 5.1 8 2.5l5.6 2.6L8 7.7z"/>
            <path d="M2.4 5.1v5.8L8 13.5V7.7M13.6 5.1v5.8L8 13.5"/>
            <path d="m8 4.3 1.5 1L8 6.3 6.5 5.3z"/>
          </svg>
          <span>Enchanting table</span>
          <span class="home-feature-arrow" aria-hidden="true">→</span>
        </button>
      </section>

      <section class="enchant" id="enchant" hidden="hidden" aria-labelledby="enchantTitle" tabindex="-1">
        <div class="enchant-shell">
          <header class="enchant-top">
            <button class="enchant-back" id="enchantBack" type="button" aria-label="Back to seed entry">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4"/></svg>
              <span>Seedmap</span>
            </button>
            <span class="enchant-tag"><i aria-hidden="true"></i>Java 1.21.4 · enchanting table</span>
          </header>

          <div class="enchant-layout">
            <section class="enchant-intro">
              <p class="enchant-kicker">Tool 02</p>
              <h1 id="enchantTitle">Enchanting table</h1>
              <p class="enchant-lede">Set the shelves, pick the gear, and read the three offers before you spend a level.</p>

              <div class="enchant-scene" aria-hidden="true">
                <div class="enchant-shelves" id="enchantShelves"></div>
                <div class="enchant-table">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
                    <path d="M4 21 32 8 60 21 32 34z" fill="#3a2a20" stroke="#6d543a" stroke-width="1"/>
                    <path d="M4 21 32 34v4L4 25z" fill="#241a13" stroke="#4b3726" stroke-width="1"/>
                    <path d="M60 21 32 34v4l28-13z" fill="#17110d" stroke="#4b3726" stroke-width="1"/>
                    <path d="M10 24 14 26v28l-4-2z" fill="#2a1d15" stroke="#4b3726" stroke-width="1"/>
                    <path d="M54 24 50 26v28l4-2z" fill="#1a120d" stroke="#4b3726" stroke-width="1"/>
                    <path d="M30 35 34 37v22l-4-2z" fill="#221710" stroke="#4b3726" stroke-width="1"/>
                    <path d="M10 49 32 58l22-9v4L32 62 10 53z" fill="#1b120c" stroke="#3c2b1d" stroke-width="1"/>
                    <path d="M22 19 31.5 23v5L22 24z" fill="#8e4238" stroke="#c9ae8d" stroke-width="0.7"/>
                    <path d="M42 19 32.5 23v5L42 24z" fill="#8e4238" stroke="#c9ae8d" stroke-width="0.7"/>
                    <path d="M32.5 23v5M24 20.5 31 23.7M40 20.5 33 23.7" fill="none" stroke="#e2d2b8" stroke-width="0.7"/>
                    <path d="M32 43 35.5 46.5 32 50 28.5 46.5z" fill="#6e5b96"/>
                    <path d="M32 45.2 33.7 46.5 32 47.8 30.3 46.5z" fill="#cab9e6"/>
                    <path d="M4 18 7 21 4 24 1 21z" fill="#629e98"/>
                    <path d="M60 18 63 21 60 24 57 21z" fill="#629e98"/>
                    <path d="M32 31 35 34 32 37 29 34z" fill="#629e98"/>
                    <path d="M32 5 35 8 32 11 29 8z" fill="#629e98"/>
                  </svg>
                </div>
              </div>

              <div class="enchant-caption">
                <span id="enchantShelfHint">At the cap — the bottom offer is always level 30.</span>
                <span>Every level spent rerolls all three offers.</span>
              </div>
            </section>

            <section class="enchant-work" aria-label="Enchantment calculator">
              <div class="enchant-block">
                <div class="enchant-block-head">
                  <span class="enchant-label">Gear</span>
                  <span class="enchant-meta" id="enchantGearMeta">Diamond sword · enchantability 10</span>
                </div>
                <div class="enchant-items" id="enchantItems" role="group" aria-label="Choose gear"></div>
                <div class="enchant-materials" id="enchantMaterials" role="group" aria-label="Choose material"></div>
              </div>

              <div class="enchant-block enchant-shelf-block">
                <div class="enchant-block-head">
                  <label class="enchant-label" for="enchantShelfInput">Bookshelves</label>
                  <span class="enchant-power"><b id="enchantShelfCount">15</b><span> / 15</span></span>
                </div>
                <div class="enchant-range-wrap">
                  <input id="enchantShelfInput" type="range" min="0" max="15" step="1" value="15"/>
                  <div class="enchant-range-scale" aria-hidden="true"><span>0</span><span>5</span><span>10</span><span>15</span></div>
                </div>
              </div>

              <div class="enchant-block">
                <div class="enchant-block-head">
                  <span class="enchant-label">Offers</span>
                  <span class="enchant-meta">levels required · lapis spent</span>
                </div>
                <div class="enchant-offers" id="enchantOffers" role="group" aria-label="Enchanting table offers"></div>
              </div>

              <div class="enchant-odds-block">
                <div class="enchant-odds-head">
                  <div>
                    <span class="enchant-label" id="enchantOddsTitle">Bottom offer</span>
                    <span class="enchant-odds-sub">chance to appear in one roll</span>
                  </div>
                  <span class="enchant-odds-level" id="enchantOddsLevel">level 30</span>
                </div>
                <div class="enchant-odds" id="enchantOdds" role="list"></div>
                <p class="enchant-note">Chances assume a random table offer, not a known seed. The shown level is a requirement; using a slot spends 1–3 levels. Treasure enchantments never roll here.</p>
              </div>
            </section>
          </div>
        </div>
      </section>

      <section class="map-ui" id="mapUi" hidden="hidden">
        <div class="vignette"></div>

        <div class="hud hud-seed">
          <span class="hud-label">Seed</span>
          <span class="seed-out" id="seedOut">0</span>
          <span class="loadbar" id="loadBar"><i id="loadBarFill"></i></span>
        </div>

        <div class="hud hud-readout">
          <span class="coords" id="coords">0, 0</span>
          <span class="biome-line" id="biomeLine"><span id="biomeName">—</span><span class="sep" id="bioSep" hidden="hidden">·</span><span class="structure" id="bioStruct" hidden="hidden"></span></span>
        </div>

        <div class="tools" id="tools" role="group" aria-label="Map tools">
          <div class="seg" role="group" aria-label="View">
            <button class="tool is-on" id="mapBtn" type="button" aria-pressed="true" title="Top-down map">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 4.1 6 2.7l4 1.4 3.6-1.4v9.2L10 13.3l-4-1.4-3.6 1.4z"/><path d="M6 2.7v9.2M10 4.1v9.2"/></svg>
              <span>Map</span>
            </button>
            <button class="tool" id="dioramaBtn" type="button" aria-pressed="false" title="Angled 3D diorama; elevation is illustrative">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.9 14 5.2v5.6L8 14.1 2 10.8V5.2z"/><path d="M2 5.2 8 8.5l6-3.3M8 8.5v5.6"/></svg>
              <span>Diorama</span>
            </button>
          </div>
          <span class="tool-divider" aria-hidden="true"></span>
          <button class="tool" id="measureBtn" type="button" aria-pressed="false" title="Measure a route">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 10.7 10.7 2.6l2.7 2.7-8.1 8.1z"/><path d="M4.7 9.3l1.1 1.1M6.8 7.2l1.1 1.1M8.9 5.1l1.1 1.1"/></svg>
            <span>Measure</span>
          </button>
        </div>

        <aside class="measure" id="measurePanel" hidden="hidden" aria-live="polite">
          <div class="measure-head">
            <span class="measure-kicker">Route</span>
            <span class="measure-count" id="measureCount">0 points</span>
            <button class="measure-clear" id="measureClear" type="button" hidden="hidden">Clear</button>
          </div>
          <div class="measure-total"><span id="measureTotal">—</span><span class="measure-unit">blocks</span></div>
          <div class="measure-time" id="measureTime">Click the map to place a point</div>
          <div class="measure-route" id="measureRoute"></div>
        </aside>

        <aside class="key" id="key" aria-label="Map key">
          <div class="key-head">
            <span class="t">Key</span>
            <span class="s">Java 1.21.4</span>
          </div>
          <div class="key-grid" id="keyGrid"></div>
          <div class="key-rule"></div>
          <div class="key-sub">Biome colours</div>
          <div class="biome-grid" id="biomeGrid"></div>
          <div class="key-note">Underground markers are placements, not entrances.<br/>Diorama elevation is illustrative, not block-exact terrain.</div>
        </aside>

        <div class="scale">
          <div class="scale-num" id="scaleNum">500 blocks</div>
          <div class="scale-bar" id="scaleBar" style="width:100px"></div>
        </div>

        <div class="hint" id="hint">Drag to pan · scroll to zoom · M to measure · D for diorama · esc for a new seed</div>
      </section>

    </div>
  </foreignObject>

  <script><![CDATA[
/*__APP__*/
  ]]></script>
</svg>
